[build-system]
requires = ["pdm-backend>=2.4.0"]
build-backend = "pdm.backend"

[project]
name = "piphi-network-aqara"
version = "0.1.0"
description = "PiPhi runtime integration for Aqara Open API cloud devices."
authors = [
    {name = "PiPhi Network", email = "support@piphi.io"},
    {name = "KelvinSan", email = "kelvin.sanyaolu@gmail.com"},
]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "piphi-runtime-kit-python>=0.0.24",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"

[tool.pdm.scripts]
release-version = "python scripts/release.py"
release-github = "python scripts/create_github_release.py"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "piphi-runtime-testkit-python>=0.0.26",
]
